<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои задачи — блоки</title>

<style>
/* ===== ТЕМЫ ===== */
:root{
 --bg:#eef1f5;
 --glass:rgba(255,255,255,.75);
 --text:#1d1d1f;
 --accent:#007aff;
 --shadow:0 20px 40px rgba(0,0,0,.08);
 --done:rgba(52,199,89,.25);
 --blur:16px;
}
body.dark{
 --bg:#0e0e11;
 --glass:rgba(25,25,28,.75);
 --text:#f5f5f7;
 --shadow:0 20px 40px rgba(0,0,0,.5);
}
body.beige{
 --bg:#e7dfd3;
 --glass:rgba(255,255,255,.7);
 --text:#2f2419;
}

/* ===== 🌙 СЕКРЕТНЫЙ СЕРЫЙ РЕЖИМ ===== */
body.secret{
 --bg:#1e1f22;
 --glass:rgba(80,80,85,.30);
 --text:#ffffff;
 --accent:#9aa0a6;
 --shadow:0 20px 40px rgba(0,0,0,.65);
 --done:rgba(200,200,200,.35);
}

/* 🔥 ЖИДКОЕ СТЕКЛО — ПРОСТО УВЕЛИЧИВАЕМ BLUR */
body.glass{
 --blur:28px;
}

/* прозрачность в secret */
body.secret .section{background:rgba(120,120,130,.22);}
body.secret .card{background:rgba(255,255,255,.08);}

/* ===== БАЗА ===== */
*{box-sizing:border-box;font-family:-apple-system,system-ui}
body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 transition:.35s ease;
}

.app{max-width:900px;margin:auto;padding:90px 14px}

/* ===== БЛОКИ ===== */
.section{
 background:var(--glass);
 backdrop-filter:blur(var(--blur));
 box-shadow:var(--shadow);
 border-radius:22px;
 padding:18px;
 margin-bottom:20px;
}

header{
 position:fixed;
 top:0;left:0;right:0;
 backdrop-filter:blur(var(--blur));
 background:var(--glass);
 padding:14px 18px;
 box-shadow:var(--shadow);
 z-index:20;
}
h2{margin:0}

/* ===== КАРТОЧКИ ===== */
.card{
 background:rgba(255,255,255,.55);
 backdrop-filter:blur(12px);
 border-radius:18px;
 padding:14px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-top:10px;
 box-shadow:0 8px 18px rgba(0,0,0,.08);
 transition:.25s;
}
body.dark .card{background:rgba(40,40,40,.65)}
.card:hover{transform:scale(1.01)}
.card.done{background:var(--done)}

button{
 border:none;
 padding:9px 14px;
 border-radius:13px;
 background:var(--accent);
 color:white;
 cursor:pointer;
 font-weight:600;
}

input{
 width:100%;
 border-radius:14px;
 border:1px solid rgba(0,0,0,.15);
 padding:10px 12px;
 background:rgba(255,255,255,.7);
}

/* ===== НАВИГАЦИЯ ===== */
nav{
 position:fixed;
 bottom:0;left:0;right:0;
 background:var(--glass);
 backdrop-filter:blur(var(--blur));
 box-shadow:var(--shadow);
 display:flex;
 justify-content:space-around;
 padding:10px;
}
nav div{
 padding:9px 14px;
 border-radius:14px;
 cursor:pointer;
}
nav div.active{
 background:var(--accent);
 color:white;
}

.fade{animation:fade .2s}
@keyframes fade{from{opacity:0;translate:0 6px}}
</style>
</head>

<body>
<header><h2 id="title">Мои задачи</h2></header>

<div class="app">

<div id="screen_tasks" class="screen fade"></div>
<div id="screen_folders" class="screen fade" style="display:none"></div>
<div id="screen_trash" class="screen fade" style="display:none"></div>
<div id="screen_chat" class="screen fade" style="display:none"></div>
<div id="screen_profile" class="screen fade" style="display:none"></div>

</div>

<nav>
 <div onclick="openTab('tasks')" class="active">Задачи</div>
 <div onclick="openTab('folders')">Папки</div>
 <div onclick="openTab('trash')">Корзина</div>
 <div onclick="openTab('chat')">ИИ-бот</div>
 <div onclick="openTab('profile')">Профиль</div>
</nav>

<script>
let data = JSON.parse(localStorage.appData||`{
 "tasks":[],
 "folders":[],
 "trash":[],
 "chat":[],
 "theme":"light",
 "user":"",
 "glass":false
}`)

let secretSteps=[]
let secretUnlocked=false
let starLayer=null

save();applyTheme()

function save(){localStorage.appData=JSON.stringify(data)}
function canEdit(){return data.user!==""}

/* ========= ТАБЫ ========= */
function openTab(tab){
 document.querySelectorAll(".screen").forEach(s=>s.style.display="none")
 document.getElementById("screen_"+tab).style.display="block"
 document.getElementById("title").innerText=
  tab=="tasks"?"Мои задачи":
  tab=="folders"?"Папки":
  tab=="trash"?"Корзина":
  tab=="chat"?"ИИ-помощник":
  "Профиль"

 document.querySelectorAll("nav div").forEach(x=>x.classList.remove("active"))
 event.target.classList.add("active")

 render()
}

/* ========= РЕНДЕР ========= */
function render(){
 renderTasks();renderFolders();renderTrash();renderChat();renderProfile()
}

/* ========= ЗАДАЧИ ========= */
function renderTasks(){
 let el=screen_tasks
 el.innerHTML=\`
 <div class="section">
 <h3>Задачи</h3>
 <div class="card">
  <input id="newTask" placeholder="Новая задача">
  <button onclick="addTask()">Добавить</button>
 </div>\`
 data.tasks.forEach((t,i)=>{
 el.innerHTML+=\`
 <div class="card \${t.done?'done':''}" onclick="toggleTask(\${i})">
  <span>\${t.text}</span>
  <button onclick="event.stopPropagation();delTask(\${i})">🗑</button>
 </div>\`})
 el.innerHTML+=\`</div>\`
}
function addTask(){if(!canEdit())return alert("Войдите в профиль");let v=newTask.value.trim();if(!v)return;data.tasks.push({text:v,done:0});newTask.value="";save();render()}
function toggleTask(i){if(!canEdit())return;data.tasks[i].done=!data.tasks[i].done;save();render()}
function delTask(i){data.trash.push({type:"task",item:data.tasks[i]});data.tasks.splice(i,1);save();render()}

/* ========= ПАПКИ ========= */
function renderFolders(){
 let el=screen_folders
 el.innerHTML=\`
 <div class="section">
 <h3>Папки</h3>
 <div class="card">
  <input id="newFolder" placeholder="Название папки">
  <button onclick="addFolder()">Создать</button>
 </div>\`
 data.folders.forEach((f,i)=>{
 el.innerHTML+=\`
 <div class="card">
  <span>\${f.name}</span>
  <button onclick="delFolder(\${i})">🗑</button>
 </div>\`})
 el.innerHTML+=\`</div>\`
}
function addFolder(){if(!canEdit())return alert("Войдите в профиль");let v=newFolder.value.trim();if(!v)return;data.folders.push({name:v});newFolder.value="";save();render()}
function delFolder(i){data.trash.push({type:"folder",item:data.folders[i]});data.folders.splice(i,1);save();render()}

/* ========= КОРЗИНА ========= */
function renderTrash(){
 let el=screen_trash
 el.innerHTML=\`<div class="section"><h3>Корзина</h3>
 <div class="card"><button onclick="clearTrash()">Очистить корзину</button></div>\`
 data.trash.forEach(t=>{
 el.innerHTML+=\`<div class="card">\${t.type}: \${t.item.text||t.item.name}</div>\`})
 el.innerHTML+=\`</div>\`
}
function clearTrash(){data.trash=[];save();render()}

/* ========= ЧАТ ========= */
function renderChat(){
 let el=screen_chat
 el.innerHTML=\`<div class="section"><h3>ИИ-бот</h3>
 <div id="chatBox"></div>
 <div class="card">
  <input id="msg" placeholder="Сообщение...">
  <button onclick="send()">Отправить</button>
 </div></div>\`
 chatBox.innerHTML=""
 data.chat.forEach(c=>chatBox.innerHTML+=\`<div class="card">\${c}</div>\`)
}

/* ========= БОТ ========= */
function tryCalc(text){
 if(!/^[0-9+\-*/().,\s]+$/.test(text)) return null
 try{
   let res = Function("return ("+text.replace(/,/g,'.')+")")()
   if(isNaN(res)) return null
   return +res.toFixed(6)
 }catch{return null}
}
function smartReply(text){
 let calc=tryCalc(text)
 if(calc!==null)return "Результат: "+calc
 let words=text.toLowerCase().replace(/[^\wа-яё\s]+/gi,"").split(/\s+/).filter(w=>w.length>1)
 if(words.length===0)return "Я пытаюсь понять твоё сообщение 🙂"
 let connectors=["и","поэтому","в целом","можно сказать"]
 let out=[]
 while(out.length<Math.min(words.length+1,12)){
  let w=words[Math.floor(Math.random()*words.length)]
  out.push(w)
  if(Math.random()<0.25)out.push(connectors[Math.floor(Math.random()*connectors.length)])
 }
 let s=out.join(" ")
 return s[0].toUpperCase()+s.slice(1)+"."
}
function send(){
 let v=msg.value.trim();if(!v)return
 data.chat.push("Вы: "+v)
 data.chat.push("Бот: "+smartReply(v))
 msg.value=""
 save();render()
}

/* ========= ПРОФИЛЬ ========= */
function renderProfile(){
 let el=screen_profile
 el.innerHTML=\`<div class="section"><h3>Профиль</h3>\`+
 (data.user?
 \`<div class="card">Привет, <b>\${data.user}</b></div>
  <div class="card"><button onclick="logout()">Удалить профиль</button></div>
  <div class="card">
   <button onclick="setTheme('light')">🌕 Светлая</button>
   <button onclick="setTheme('dark')">🌑 Тёмная</button>
   <button onclick="setTheme('beige')">🟫 Бежевая</button>
  </div>
  <div class="card">
   <button onclick="toggleGlass()">\${data.glass?'Отключить жидкое стекло 🫧':'Включить жидкое стекло 🫧'}</button>
  </div>
  \${secretUnlocked?'<div class="card"><button onclick="enableSecret()">✨ Секретный режим</button></div>':''}
 \`
 :
 \`<div class="card">
   <input id="loginName" placeholder="Ваше имя">
   <button onclick="login()">Войти</button>
  </div>\`
 )+\`</div>\`
}
function toggleGlass(){
 data.glass=!data.glass
 applyTheme()
 save()
 render()
}
function login(){let v=loginName.value.trim();if(!v)return;data.user=v;save();render()}
function logout(){data.user="";save();render()}

/* ========= ЛОГИКА ТЕМ ========= */
function setTheme(t){
 if(t==="light") secretSteps=["light"]
 else if(t==="dark" && secretSteps[0]==="light") secretSteps.push("dark")
 else if(t==="beige" && secretSteps[0]==="light" && secretSteps[1]==="dark"){
  secretSteps.push("beige")
  secretUnlocked=true
  alert("✨ Найден секрет! Кнопка появилась в профиле 😉")
 } else secretSteps=[]
 data.theme=t
 save()
 applyTheme()
 render()
}
function enableSecret(){
 data.theme="secret"
 save()
 applyTheme()
 makeStars()
}

/* ========= ЗВЁЗДЫ ========= */
function makeStars(){
 if(starLayer) starLayer.remove()
 starLayer=document.createElement("div")
 starLayer.style.position="fixed"
 starLayer.style.inset="0"
 starLayer.style.pointerEvents="none"
 starLayer.style.zIndex="-1"
 let html=""
 for(let i=0;i<140;i++){
  let x=Math.random()*100
  let y=Math.random()*100
  let s=Math.random()*3+1
  html+=\`<div style="position:absolute;left:\${x}%;top:\${y}%;width:\${s}px;height:\${s}px;background:white;border-radius:50%;opacity:.9"></div>\`
 }
 starLayer.innerHTML=html
 document.body.appendChild(starLayer)
}

/* ========= ПРИМЕНЕНИЕ ТЕМ ========= */
function applyTheme(){
 document.body.className=""
 if(data.theme=="dark")document.body.classList.add("dark")
 if(data.theme=="beige")document.body.classList.add("beige")
 if(data.theme=="secret"){
  document.body.classList.add("secret")
  makeStars()
 } else if(starLayer){
  starLayer.remove()
 }
 if(data.glass) document.body.classList.add("glass")
}

render()
</script>
</body>
</html>
