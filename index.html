<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои задачи — рабочая версия</title>

<style>
*{box-sizing:border-box;font-family:-apple-system,system-ui}
body{margin:0;background:#eef1f5}

header{
 position:fixed;top:0;left:0;right:0;
 background:white;
 padding:14px;
 box-shadow:0 5px 15px rgba(0,0,0,.1);
 z-index:10;
}

.app{padding:80px 14px 80px}

.section{
 background:white;
 border-radius:16px;
 padding:14px;
 margin-bottom:16px;
 box-shadow:0 10px 24px rgba(0,0,0,.08);
}

nav{
 position:fixed;
 bottom:0;left:0;right:0;
 background:white;
 padding:10px;
 display:flex;
 justify-content:space-around;
 box-shadow:0 -5px 15px rgba(0,0,0,.1);
}
nav button{
 padding:10px 14px;
 border-radius:14px;
 border:none;
 background:#e5e5ea;
}
nav button.active{
 background:#007aff;
 color:white;
}

.card{
 background:#f5f5f5;
 border-radius:14px;
 padding:10px;
 margin-top:8px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}
</style>
</head>

<body>

<header>
 <h2 id="title">Мои задачи</h2>
</header>

<div class="app">

 <!-- задачи -->
 <div id="tab_tasks" class="tab">
  <div class="section">
   <h3>Задачи</h3>
   <div id="tasks"></div>
  </div>
 </div>

 <!-- папки -->
 <div id="tab_folders" class="tab" style="display:none">
  <div class="section">
   <h3>Папки</h3>
   <div id="folders"></div>
  </div>
 </div>

 <!-- корзина -->
 <div id="tab_trash" class="tab" style="display:none">
  <div class="section">
   <h3>Корзина</h3>
  </div>
 </div>

 <!-- чат -->
 <div id="tab_chat" class="tab" style="display:none">
  <div class="section">
   <h3>ИИ чат</h3>
  </div>
 </div>

 <!-- профиль -->
 <div id="tab_profile" class="tab" style="display:none">
  <div class="section">
   <h3>Профиль</h3>
   <p>Здесь будет профиль</p>
  </div>
 </div>

</div>

<nav>
 <button id="btn_tasks" onclick="openTab('tasks')">Задачи</button>
 <button id="btn_folders" onclick="openTab('folders')">Папки</button>
 <button id="btn_trash" onclick="openTab('trash')">Корзина</button>
 <button id="btn_chat" onclick="openTab('chat')">ИИ</button>
 <button id="btn_profile" onclick="openTab('profile')">Профиль</button>
</nav>

<script>
function openTab(name){
 const tabs=['tasks','folders','trash','chat','profile'];

 tabs.forEach(t=>{
  document.getElementById('tab_'+t).style.display = (t===name)?'block':'none';
  document.getElementById('btn_'+t).classList.remove('active');
 });

 document.getElementById('btn_'+name).classList.add('active');

 document.getElementById('title').innerText =
  name==='tasks'?'Мои задачи':
  name==='folders'?'Папки':
  name==='trash'?'Корзина':
  name==='chat'?'ИИ чат':'Профиль';
}

// включаем первую вкладку при загрузке
openTab('tasks');
</script>

</body>
</html>
