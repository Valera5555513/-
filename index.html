<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои задачи — Full Pro</title>

<style>
*{box-sizing:border-box;font-family:-apple-system,system-ui}
body{margin:0;transition:.3s;background:var(--bg)}

:root{
 --bg:#eef1f5; --panel:#ffffffcc; --text:#1c1c1e; --accent:#007aff;
 --shadow:0 18px 34px rgba(0,0,0,.07); --blur:16px;
 --success: #d4edda; --success-text: #155724;
}

body.dark{--bg:#121214;--panel:#1c1c1edd;--text:#f2f2f7;--shadow:0 18px 34px rgba(0,0,0,.5); --success: #1b4332; --success-text: #81c784;}
body.beige{--bg:#e9dfd3;--panel:#ffffffc9;--text:#2e2419; --success: #d8e2dc; --success-text: #4a5d4e;}
body.secret{--bg:#202124;--panel:#3a3b3c99;--text:#ffffff;--accent:#9aa0a6;--shadow:0 18px 34px rgba(0,0,0,.6); --success: #2d3436; --success-text: #55efc4;}
body.glass{--blur:28px}

header{
 position:fixed;top:0;left:0;right:0;
 background:var(--panel); backdrop-filter:blur(var(--blur));
 padding:14px; box-shadow:var(--shadow); z-index:10; color:var(--text);
}

.app{padding:80px 14px 100px; min-height:100vh;}

.section{
 background:var(--panel); backdrop-filter:blur(var(--blur));
 border-radius:16px; padding:14px; margin-bottom:16px;
 box-shadow:var(--shadow); color:var(--text);
}

nav{
 position:fixed; bottom:0;left:0;right:0;
 background:var(--panel); backdrop-filter:blur(var(--blur));
 padding:10px; display:flex; justify-content:space-around; box-shadow:var(--shadow);
}
nav button{padding:10px; border-radius:14px; border:none; background:#e5e5ea66; color:var(--text); cursor:pointer}
nav button.active{background:var(--accent); color:white;}

.card{
 background:#f5f5f588; border-radius:14px; padding:12px; margin-top:8px;
 display:flex; justify-content:space-between; align-items:center; color:var(--text);
}
.card.done {background: var(--success) !important; color: var(--success-text);}

.controls{display:flex; gap:8px; margin-bottom:12px;}
input, select{border-radius:12px; border:1px solid #ccc; padding:8px 10px; width:100%; background:white}
button{cursor:pointer; border-radius:8px; border:1px solid #ccc; padding:6px 12px; transition:0.2s}
.btn-add{background:var(--accent); color:white; border:none}
.btn-del{background:#ff3b30; color:white; border:none}
.btn-warn{background:#ff9500; color:white; border:none}

.avatar-grid{display:grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top:10px}
.avatar-item{font-size:24px; cursor:pointer; text-align:center; padding:5px; border-radius:8px}
.avatar-item:hover{background:#007aff22}
</style>
</head>

<body>

<header>
 <h2 id="title">Задачи</h2>
</header>

<div class="app">
 <div id="auth_screen" class="tab">
  <div class="section">
   <h3>Добро пожаловать</h3>
   <input id="loginName" placeholder="Ваше имя"><br><br>
   <p>Выберите аватар:</p>
   <div class="avatar-grid" id="loginAvatars"></div>
   <br>
   <button class="btn-add" style="width:100%" onclick="login()">Начать работу</button>
  </div>
 </div>

 <div id="tab_tasks" class="tab" style="display:none">
  <div class="section">
   <div class="controls">
    <input type="text" id="taskInput" placeholder="Новая задача">
    <button class="btn-add" onclick="addTask()">+</button>
   </div>
   <div id="tasksList"></div>
  </div>
 </div>

 <div id="tab_folders" class="tab" style="display:none">
  <div class="section">
   <div class="controls">
    <select id="folderEmoji" style="width:60px"><option>📁</option><option>🏠</option><option>💼</option><option>🎯</option><option>🌟</option></select>
    <input type="text" id="folderInput" placeholder="Имя папки">
    <button class="btn-add" onclick="addFolder()">+</button>
   </div>
   <div id="foldersList"></div>
  </div>
 </div>

 <div id="tab_trash" class="tab" style="display:none">
  <div class="section">
   <button class="btn-del" style="width:100%; margin-bottom:10px" onclick="clearTrash()">Очистить корзину</button>
   <div id="trashList"></div>
  </div>
 </div>

 <div id="tab_chat" class="tab" style="display:none">
  <div class="section">
   <div id="chatBox">
    <p>🤖 Привет! Я твой помощник.</p>
    <button onclick="aiCount()">Сколько у меня задач?</button>
   </div>
   <div id="aiResponse" style="margin-top:15px; font-weight:bold"></div>
  </div>
 </div>

 <div id="tab_profile" class="tab" style="display:none">
  <div class="section" id="profileBox"></div>
 </div>
</div>

<nav id="mainNav" style="display:none">
 <button id="btn_tasks" onclick="openTab('tasks')">📝</button>
 <button id="btn_folders" onclick="openTab('folders')">📂</button>
 <button id="btn_trash" onclick="openTab('trash')">🗑️</button>
 <button id="btn_chat" onclick="openTab('chat')">🤖</button>
 <button id="btn_profile" onclick="openTab('profile')">👤</button>
</nav>

<script>
const avatars = ['👤','🐱','🐶','🦊','🦁','🐸','🐙','⭐️','🚀','😎'];
let selectedAvatar = '👤';

let data = JSON.parse(localStorage.appData || '{"user":"","avatar":"👤","theme":"light","glass":false,"tasks":[],"trash":[],"folders":[]}');
let secret = [];
let unlocked = false;

function save(){ localStorage.appData = JSON.stringify(data); }

function login(){
 let v = document.getElementById("loginName").value.trim();
 if(!v) return;
 data.user = v;
 data.avatar = selectedAvatar;
 save();
 checkAuth();
}

function deleteProfile(){
 if(confirm("Удалить профиль и все данные?")){
  localStorage.removeItem('appData');
  location.reload();
 }
}

function checkAuth(){
 if(!data.user){
  document.getElementById('auth_screen').style.display = 'block';
  document.getElementById('mainNav').style.display = 'none';
  renderAvatarGrid('loginAvatars');
 } else {
  document.getElementById('auth_screen').style.display = 'none';
  document.getElementById('mainNav').style.display = 'flex';
  openTab('tasks');
 }
}

function renderAvatarGrid(id){
 let g = document.getElementById(id);
 g.innerHTML = '';
 avatars.forEach(a => {
  let s = document.createElement('div');
  s.className = 'avatar-item';
  s.innerText = a;
  s.onclick = () => {
   selectedAvatar = a;
   if(data.user) { data.avatar = a; save(); renderProfile(); }
   Array.from(g.children).forEach(c => c.style.background = 'none');
   s.style.background = '#007aff44';
  };
  g.appendChild(s);
 });
}

function openTab(name){
 if(!data.user) return;
 ['tasks','folders','trash','chat','profile'].forEach(t=>{
  let el = document.getElementById('tab_'+t);
  if(el) el.style.display = (t===name)?'block':'none';
  document.getElementById('btn_'+t).classList.remove('active');
 });
 document.getElementById('btn_'+name).classList.add('active');
 document.getElementById('title').innerText = name.toUpperCase();
 
 if(name==='tasks') renderTasks();
 if(name==='folders') renderFolders();
 if(name==='trash') renderTrash();
 if(name==='profile') renderProfile();
}

/* ЗАДАЧИ */
function addTask(){
 let i = document.getElementById("taskInput");
 if(!i.value) return;
 data.tasks.push({id:Date.now(), text:i.value, done:false});
 i.value=""; save(); renderTasks();
}
function toggleTask(id){
 data.tasks = data.tasks.map(t => t.id===id ? {...t, done:!t.done} : t);
 save(); renderTasks();
}
function deleteTask(id){
 let t = data.tasks.find(x => x.id === id);
 data.trash.push(t);
 data.tasks = data.tasks.filter(x => x.id !== id);
 save(); renderTasks();
}

function renderTasks(){
 let c = document.getElementById("tasksList");
 c.innerHTML = data.tasks.map(t => `
  <div class="card ${t.done?'done':''}">
   <span onclick="toggleTask(${t.id})" style="flex:1">${t.text}</span>
   <button class="btn-del" onclick="deleteTask(${t.id})">✕</button>
  </div>`).join('');
}

/* КОРЗИНА */
function renderTrash(){
 let c = document.getElementById("trashList");
 c.innerHTML = data.trash.map(t => `
  <div class="card">
   <span>${t.text}</span>
   <div>
    <button onclick="restore(${t.id})">↩️</button>
    <button class="btn-del" onclick="burn(${t.id})">🗑️</button>
   </div>
  </div>`).join('');
}
function restore(id){
 let t = data.trash.find(x => x.id === id);
 data.tasks.push(t);
 data.trash = data.trash.filter(x => x.id !== id);
 save(); renderTrash();
}
function burn(id){
 data.trash = data.trash.filter(x => x.id !== id);
 save(); renderTrash();
}
function clearTrash(){ data.trash=[]; save(); renderTrash(); }

/* ПАПКИ */
function addFolder(){
 let i = document.getElementById("folderInput");
 let e = document.getElementById("folderEmoji");
 if(!i.value) return;
 data.folders.push({id:Date.now(), name:i.value, emoji:e.value});
 i.value=""; save(); renderFolders();
}
function deleteFolder(id){
 data.folders = data.folders.filter(f => f.id !== id);
 save(); renderFolders();
}
function renderFolders(){
 let c = document.getElementById("foldersList");
 c.innerHTML = data.folders.map(f => `
  <div class="card">
   <span>${f.emoji} ${f.name}</span>
   <button class="btn-del" onclick="deleteFolder(${f.id})">✕</button>
  </div>`).join('');
}

/* ИИ ЧАТ */
function aiCount(){
 let active = data.tasks.filter(t => !t.done).length;
 let done = data.tasks.filter(t => t.done).length;
 document.getElementById('aiResponse').innerText = `У тебя ${active} активных задач и ${done} выполненных!`;
}

/* ТЕМЫ */
function applyTheme(){
 document.body.className = data.theme;
 if(data.glass) document.body.classList.add("glass");
 if(data.theme==="secret") makeStars();
}
function setTheme(t){
 if(t==="light") secret=["light"];
 else if(t==="dark" && secret[0]==="light") secret.push("dark");
 else if(t==="beige" && secret[1]==="dark") unlocked=true;
 data.theme=t; save(); applyTheme(); renderProfile();
}

function toggleGlass(){ data.glass=!data.glass; save(); applyTheme(); renderProfile(); }

function renderProfile(){
 let box = document.getElementById("profileBox");
 box.innerHTML = `
  <div style="text-align:center; margin-bottom:20px">
   <div style="font-size:50px">${data.avatar}</div>
   <h2>${data.user}</h2>
  </div>
  <div class="card">Сменить аватар: <div class="avatar-grid" id="profileAvatars"></div></div>
  <div class="card">Темы: 
   <button onclick="setTheme('light')">🌕</button>
   <button onclick="setTheme('dark')">🌑</button>
   <button onclick="setTheme('beige')">🟫</button>
  </div>
  <div class="card">Стекло: <button onclick="toggleGlass()">${data.glass?'ВКЛ':'ВЫКЛ'}</button></div>
  ${unlocked?'<div class="card"><button style="width:100%" onclick="setTheme(\'secret\')">✨ Секрет</button></div>':''}
  <br>
  <button class="btn-del" style="width:100%" onclick="deleteProfile()">Удалить профиль</button>
 `;
 renderAvatarGrid('profileAvatars');
}

function makeStars(){
 let d=document.createElement("div"); d.style.position="fixed"; d.style.inset="0"; d.style.pointerEvents="none";
 document.body.appendChild(d);
 for(let i=0;i<50;i++){
  let s=document.createElement("div"); s.style.position="absolute"; s.style.width="2px"; s.style.height="2px";
  s.style.background="white"; s.style.left=Math.random()*100+"%"; s.style.top=Math.random()*100+"%";
  d.appendChild(s);
 }
}

checkAuth();
applyTheme();
</script>
</body>
</html>
