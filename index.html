<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои задачи — с профилем и темами</title>

<style>
*{box-sizing:border-box;font-family:-apple-system,system-ui}
body{margin:0;transition:.3s}

/* базовые переменные */
:root{
 --bg:#eef1f5;
 --panel:#ffffffcc;
 --text:#1c1c1e;
 --accent:#007aff;
 --shadow:0 18px 34px rgba(0,0,0,.07);
 --blur:16px;
}

/* темы */
body.dark{--bg:#121214;--panel:#1c1c1edd;--text:#f2f2f7;--shadow:0 18px 34px rgba(0,0,0,.5)}
body.beige{--bg:#e9dfd3;--panel:#ffffffc9;--text:#2e2419;}
body.secret{--bg:#202124;--panel:#3a3b3c99;--text:#ffffff;--accent:#9aa0a6;--shadow:0 18px 34px rgba(0,0,0,.6)}

/* стекло */
body.glass{--blur:28px}

/* оформление */
header{
 position:fixed;top:0;left:0;right:0;
 background:var(--panel);
 backdrop-filter:blur(var(--blur));
 padding:14px;
 box-shadow:var(--shadow);
 z-index:10;
 color:var(--text);
}

.app{padding:80px 14px 80px;background:var(--bg);min-height:100vh;}

.section{
 background:var(--panel);
 backdrop-filter:blur(var(--blur));
 border-radius:16px;
 padding:14px;
 margin-bottom:16px;
 box-shadow:var(--shadow);
 color:var(--text);
}

nav{
 position:fixed;
 bottom:0;left:0;right:0;
 background:var(--panel);
 backdrop-filter:blur(var(--blur));
 padding:10px;
 display:flex;
 justify-content:space-around;
 box-shadow:var(--shadow);
}
nav button{
 padding:10px 14px;
 border-radius:14px;
 border:none;
 background:#e5e5ea66;
 color:var(--text);
}
nav button.active{
 background:var(--accent);
 color:white;
}

.card{
 background:#f5f5f588;
 border-radius:14px;
 padding:10px;
 margin-top:8px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 color:var(--text);
}

input{
 border-radius:12px;
 border:1px solid #ccc;
 padding:8px 10px;
 width:100%;
}

button{cursor:pointer}
</style>
</head>

<body>

<header>
 <h2 id="title">Мои задачи</h2>
</header>

<div class="app">

 <!-- задачи -->
 <div id="tab_tasks" class="tab">
  <div class="section">
   <h3>Задачи</h3>
   <div id="tasks"></div>
  </div>
 </div>

 <!-- папки -->
 <div id="tab_folders" class="tab" style="display:none">
  <div class="section">
   <h3>Папки</h3>
   <div id="folders"></div>
  </div>
 </div>

 <!-- корзина -->
 <div id="tab_trash" class="tab" style="display:none">
  <div class="section">
   <h3>Корзина</h3>
   <div id="trash"></div>
  </div>
 </div>

 <!-- чат -->
 <div id="tab_chat" class="tab" style="display:none">
  <div class="section">
   <h3>ИИ чат</h3>
   <div id="chat"></div>
  </div>
 </div>

 <!-- профиль -->
 <div id="tab_profile" class="tab" style="display:none">
  <div class="section" id="profileBox"></div>
 </div>

</div>

<nav>
 <button id="btn_tasks" onclick="openTab('tasks')">Задачи</button>
 <button id="btn_folders" onclick="openTab('folders')">Папки</button>
 <button id="btn_trash" onclick="openTab('trash')">Корзина</button>
 <button id="btn_chat" onclick="openTab('chat')">ИИ</button>
 <button id="btn_profile" onclick="openTab('profile')">Профиль</button>
</nav>

<script>
let data = JSON.parse(localStorage.appData || '{"user":"","theme":"light","glass":false}');
let secret = [];
let unlocked = false;

function save(){localStorage.appData = JSON.stringify(data);}

function applyTheme(){
 document.body.className = "";
 if(data.theme==="dark") document.body.classList.add("dark");
 if(data.theme==="beige") document.body.classList.add("beige");
 if(data.theme==="secret") {document.body.classList.add("secret");makeStars();}
 if(data.glass) document.body.classList.add("glass");
}

function openTab(name){
 ['tasks','folders','trash','chat','profile'].forEach(t=>{
  document.getElementById('tab_'+t).style.display = (t===name)?'block':'none';
  document.getElementById('btn_'+t).classList.remove('active');
 });
 document.getElementById('btn_'+name).classList.add('active');

 document.getElementById('title').innerText =
  name==='tasks'?'Мои задачи':
  name==='folders'?'Папки':
  name==='trash'?'Корзина':
  name==='chat'?'ИИ чат':'Профиль';

 renderProfile();
}

function login(){
 let v=document.getElementById("loginName").value.trim();
 if(!v) return;
 data.user=v;save();renderProfile();
}
function logout(){data.user="";save();renderProfile();}

/* темы с секретом */
function setTheme(t){
 if(t==="light") secret=["light"];
 else if(t==="dark" && secret[0]==="light") secret.push("dark");
 else if(t==="beige" && secret[1]==="dark"){
  unlocked=true;
  alert("✨ Секретный режим открыт!");
 }
 data.theme=t;
 save();
 applyTheme();
 renderProfile();
}

function enableSecret(){
 data.theme="secret";
 save();
 applyTheme();
}

function toggleGlass(){data.glass=!data.glass;save();applyTheme();renderProfile();}

let starsDiv=null;
function makeStars(){
 if(starsDiv) starsDiv.remove();
 starsDiv=document.createElement("div");
 starsDiv.style.position="fixed";
 starsDiv.style.inset="0";
 starsDiv.style.pointerEvents="none";
 document.body.appendChild(starsDiv);
 for(let i=0;i<120;i++){
  let s=document.createElement("div");
  s.style.position="absolute";
  s.style.width=s.style.height=(Math.random()*3+1)+"px";
  s.style.background="white";
  s.style.borderRadius="50%";
  s.style.left=Math.random()*100+"%";
  s.style.top=Math.random()*100+"%";
  starsDiv.appendChild(s);
 }
}

/* профиль */
function renderProfile(){
 let box=document.getElementById("profileBox");
 if(!data.user){
  box.innerHTML = `
   <h3>Вход</h3>
   <input id="loginName" placeholder="Ваше имя"><br><br>
   <button onclick="login()">Войти</button>
  `;
  return;
 }

 box.innerHTML = `
  <h3>Профиль</h3>
  <div class="card">Привет, <b>${data.user}</b></div>
  <div class="card">
   <button onclick="logout()">Выйти</button>
  </div>

  <div class="card">
   <button onclick="setTheme('light')">🌕 Светлая</button>
   <button onclick="setTheme('dark')">🌑 Тёмная</button>
   <button onclick="setTheme('beige')">🟫 Бежевая</button>
  </div>

  <div class="card">
   <button onclick="toggleGlass()">${data.glass?'Отключить':'Включить'} жидкое стекло 🫧</button>
  </div>

  ${unlocked?'<div class="card"><button onclick="enableSecret()">✨ Секретный режим</button></div>':''}
 `;
}

applyTheme();
openTab("tasks");
</script>

</body>
</html>
