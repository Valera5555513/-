<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои задачи</title>
<style>
:root{
 --bg:#eef1f5;
 --glass:rgba(255,255,255,.75);
 --text:#1d1d1f;
 --accent:#007aff;
 --shadow:0 20px 40px rgba(0,0,0,.08);
 --done:rgba(52,199,89,.25);
 --blur:16px;
}
body.dark{--bg:#0e0e11;--glass:rgba(25,25,28,.75);--text:#f5f5f7;--shadow:0 20px 40px rgba(0,0,0,.5);}
body.beige{--bg:#e7dfd3;--glass:rgba(255,255,255,.7);--text:#2f2419;}
body.secret{--bg:#1f2024;--glass:rgba(90,90,95,.25);--text:#ffffff;--accent:#9aa0a6;--shadow:0 20px 40px rgba(0,0,0,.6);--done:rgba(200,200,200,.35);--blur:26px;}
body.glass{--blur:30px}
*{box-sizing:border-box;font-family:-apple-system,system-ui}
body{margin:0;background:var(--bg);color:var(--text);transition:.35s}
header{position:fixed;top:0;left:0;right:0;background:var(--glass);backdrop-filter:blur(var(--blur));box-shadow:var(--shadow);padding:14px 18px;z-index:10;}
.app{max-width:900px;margin:auto;padding:90px 14px}
.section{background:var(--glass);backdrop-filter:blur(var(--blur));border-radius:22px;padding:18px;margin-bottom:20px;box-shadow:var(--shadow);}
.card{background:rgba(255,255,255,.65);border-radius:18px;padding:12px;display:flex;justify-content:space-between;align-items:center;margin-top:10px;box-shadow:0 10px 22px rgba(0,0,0,.1);}
.card.done{background:var(--done)}
button{border:none;padding:9px 14px;border-radius:13px;background:var(--accent);color:white;cursor:pointer;}
input{width:100%;border-radius:14px;border:1px solid rgba(0,0,0,.15);padding:10px 12px;background:rgba(255,255,255,.7);}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--glass);backdrop-filter:blur(var(--blur));box-shadow:var(--shadow);display:flex;justify-content:space-around;padding:10px;}
nav div{padding:9px 14px;border-radius:14px;cursor:pointer;}
nav div.active{background:var(--accent);color:white;}
</style>
</head>
<body>
<header><h2 id="title">Мои задачи</h2></header>

<div class="app">
<div id="screen_tasks" class="screen"></div>
<div id="screen_folders" class="screen" style="display:none"></div>
<div id="screen_trash" class="screen" style="display:none"></div>
<div id="screen_chat" class="screen" style="display:none"></div>
<div id="screen_profile" class="screen" style="display:none"></div>
</div>

<nav>
 <div onclick="openTab('tasks', this)" class="active">Задачи</div>
 <div onclick="openTab('folders', this)">Папки</div>
 <div onclick="openTab('trash', this)">Корзина</div>
 <div onclick="openTab('chat', this)">ИИ-бот</div>
 <div onclick="openTab('profile', this)">Профиль</div>
</nav>

<script>
let data = JSON.parse(localStorage.appData || '{"tasks":[],"folders":[],"trash":[],"chat":[],"theme":"light","user":"","glass":false}');
let secretUnlocked=false;
let starLayer=null;

function save(){localStorage.appData=JSON.stringify(data);}
function canEdit(){return data.user!=="";}

function openTab(tab, el){
 document.querySelectorAll(".screen").forEach(s=>s.style.display="none");
 document.getElementById("screen_"+tab).style.display="block";
 document.querySelectorAll("nav div").forEach(x=>x.classList.remove("active"));
 el.classList.add("active");
 document.getElementById("title").innerText=
  tab=="tasks"?"Мои задачи":
  tab=="folders"?"Папки":
  tab=="trash"?"Корзина":
  tab=="chat"?"ИИ-помощник":
  "Профиль";
 render();
}

function render(){renderTasks();renderFolders();renderTrash();renderChat();renderProfile();}

function renderTasks(){
 let el=document.getElementById("screen_tasks");
 el.innerHTML='<div class="section"><h3>Задачи</h3><div class="card"><input id="newTask" placeholder="Новая задача"><button onclick="addTask()">Добавить</button></div></div>';
 let box=el.querySelector(".section");
 data.tasks.forEach((t,i)=>{
  let d=document.createElement("div");
  d.className="card"+(t.done?" done":"");
  d.onclick=function(){toggleTask(i);};
  d.innerHTML='<span>'+t.text+'</span><button onclick="event.stopPropagation();delTask('+i+')">🗑</button>';
  box.appendChild(d);
 });
}
function addTask(){if(!canEdit())return alert("Войдите в профиль");let v=document.getElementById("newTask").value.trim();if(!v)return;data.tasks.push({text:v,done:false});save();render();}
function toggleTask(i){if(!canEdit())return;data.tasks[i].done=!data.tasks[i].done;save();render();}
function delTask(i){data.trash.push({type:"task",item:data.tasks[i]});data.tasks.splice(i,1);save();render();}

function renderFolders(){
 let el=document.getElementById("screen_folders");
 el.innerHTML='<div class="section"><h3>Папки</h3><div class="card"><input id="newFolder" placeholder="Название папки"><button onclick="addFolder()">Создать</button></div></div>';
 let box=el.querySelector(".section");
 data.folders.forEach((f,i)=>{
  let d=document.createElement("div");
  d.className="card";
  d.innerHTML='<span>'+f.name+'</span><button onclick="delFolder('+i+')">🗑</button>';
  box.appendChild(d);
 });
}
function addFolder(){if(!canEdit())return alert("Войдите в профиль");let v=document.getElementById("newFolder").value.trim();if(!v)return;data.folders.push({name:v});save();render();}
function delFolder(i){data.trash.push({type:"folder",item:data.folders[i]});data.folders.splice(i,1);save();render();}

function renderTrash(){
 let el=document.getElementById("screen_trash");
 el.innerHTML='<div class="section"><h3>Корзина</h3><div class="card"><button onclick="clearTrash()">Очистить корзину</button></div></div>';
 let box=el.querySelector(".section");
 data.trash.forEach(t=>{
  let d=document.createElement("div");
  d.className="card";
  d.textContent=t.type+': '+(t.item.text||t.item.name);
  box.appendChild(d);
 });
}
function clearTrash(){data.trash=[];save();render();}

function renderChat(){
 let el=document.getElementById("screen_chat");
 el.innerHTML='<div class="section"><h3>ИИ-бот</h3><div id="chatBox"></div><div class="card"><input id="msg" placeholder="Сообщение..."><button onclick="send()">Отправить</button></div></div>';
 let box=document.getElementById("chatBox");
 box.innerHTML="";
 data.chat.forEach(c=>{
  let d=document.createElement("div");
  d.className="card";
  d.textContent=c;
  box.appendChild(d);
 });
}

function tryCalc(text){
 if(!/^[0-9+\\-*/().,\\s]+$/.test(text)) return null;
 try{
  let res=Function("return ("+text.replace(/,/g,'.')+")")();
  if(isNaN(res)) return null;
  return +res.toFixed(6);
 }catch{return null;}
}
function smartReply(text){
 let calc=tryCalc(text);
 if(calc!==null)return "Результат: "+calc;
 return "Я тебя понял 👍";
}
function send(){
 let v=document.getElementById("msg").value.trim();
 if(!v)return;
 data.chat.push("Вы: "+v);
 data.chat.push("Бот: "+smartReply(v));
 save();
 render();
}

function renderProfile(){
 let el=document.getElementById("screen_profile");
 if(data.user){
  el.innerHTML='<div class="section"><h3>Профиль</h3><div class="card">Привет, <b>'+data.user+'</b></div><div class="card"><button onclick="logout()">Удалить профиль</button></div><div class="card"><button onclick="setTheme(\\'light\\')">🌕 Светлая</button><button onclick="setTheme(\\'dark\\')">🌑 Тёмная</button><button onclick="setTheme(\\'beige\\')">🟫 Бежевая</button></div><div class="card"><button onclick="toggleGlass()">'+(data.glass?'Отключить жидкое стекло 🫧':'Включить жидкое стекло 🫧')+'</button></div>'+(secretUnlocked?'<div class="card"><button onclick="enableSecret()">✨ Секретный режим</button></div>':'')+'</div>';
 } else {
  el.innerHTML='<div class="section"><h3>Профиль</h3><div class="card"><input id="loginName" placeholder="Ваше имя"><button onclick="login()">Войти</button></div></div>';
 }
}

function toggleGlass(){data.glass=!data.glass;applyTheme();save();render();}
function login(){let v=document.getElementById("loginName").value.trim();if(!v)return;data.user=v;save();render();}
function logout(){data.user="";save();render();}

let secretSteps=[];
function setTheme(t){
 if(t==="light") secretSteps=["light"];
 else if(t==="dark" && secretSteps[0]==="light") secretSteps.push("dark");
 else if(t==="beige" && secretSteps[0]==="light" && secretSteps[1]==="dark"){
  secretUnlocked=true;
  alert("✨ Секрет разблокирован!");
 } else secretSteps=[];
 data.theme=t;
 save();applyTheme();render();
}

function enableSecret(){data.theme="secret";save();applyTheme();makeStars();}

function makeStars(){
 if(starLayer) starLayer.remove();
 starLayer=document.createElement("div");
 starLayer.style.position="fixed";
 starLayer.style.inset="0";
 starLayer.style.pointerEvents="none";
 document.body.appendChild(starLayer);
 for(let i=0;i<120;i++){
  let s=document.createElement("div");
  s.style.position="absolute";
  s.style.width=s.style.height=(Math.random()*3+1)+"px";
  s.style.background="white";
  s.style.borderRadius="50%";
  s.style.left=Math.random()*100+"%";
  s.style.top=Math.random()*100+"%";
  starLayer.appendChild(s);
 }
}

function applyTheme(){
 document.body.className="";
 if(data.theme=="dark")document.body.classList.add("dark");
 if(data.theme=="beige")document.body.classList.add("beige");
 if(data.theme=="secret"){document.body.classList.add("secret");makeStars();}
 if(data.glass)document.body.classList.add("glass");
}

applyTheme();
render();
</script>
</body>
</html>
